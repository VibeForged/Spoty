services:
  bot:
    build: .
    env_file: .env
    # The bot image now bundles a JRE, so the launcher could start its own
    # Lavalink. In compose we use the dedicated `lavalink` service instead, so
    # skip the in-container Lavalink and connect to the service by name.
    environment:
      - SPOTY_SKIP_LAVALINK=true
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=8080
    volumes:
      - bot-data:/app/data
      - bot-logs:/app/logs
    depends_on:
      lavalink:
        condition: service_healthy
    restart: unless-stopped

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    env_file: .env
    environment:
      - SERVER_PORT=8080
      - LAVALINK_SERVER_PASSWORD=youshallnotpass
    volumes:
      - ./lavalink:/opt/lavalink/config
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'Authorization: youshallnotpass' http://localhost:8080/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  bot-data:
  bot-logs:
