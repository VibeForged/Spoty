[project]
name = "discord-music-bot"
version = "1.0.0"
description = "Production-grade Discord music bot with yt-dlp, FFmpeg, and Lavalink support"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "discord.py[voice]>=2.4.0",
    "yt-dlp>=2026.6.9",
    "wavelink>=3.4.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "alembic>=1.12",
    "aiohttp>=3.9",
    "syncedlyrics>=0.7",
    "cachetools>=5.3",
    "rapidfuzz>=3.0",
    "loguru>=0.7",
    # Capped <1.6 by discord.py[voice]; can't take 1.6.2 (CVE-2025-69277) yet.
    "PyNaCl>=1.5,<1.6",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "cogs*"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Alembic-generated migrations use the tool's own style/templates.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "cogs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
